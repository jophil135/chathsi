services:
  - type: web
    name: chathsi
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DRIVER
        value: sqlite
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PATH
        value: /tmp/chathsi.db
      - key: DATABASE_CA_CERT
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/chathsi-uploads
      - key: VOICE_DIR
        value: /tmp/chathsi-voice
      - key: MAX_VOICE_MB
        value: "10"
      - key: COOKIE_SECURE
        value: "true"
      - key: MAX_IMAGE_MB
        value: "8"
      - key: MAX_MEDIA_MB
        value: "50"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_USERNAME
        value: chathsi_admin
      - key: ADMIN_PASSWORD
        sync: false
